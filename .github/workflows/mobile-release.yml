name: Mobile Release (Consumer)

# Triggered by pushing a semver tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Apple App Store and Google Play credentials are stored in EAS (via `eas credentials`),
# not in GitHub secrets. Only EXPO_TOKEN is needed here to authenticate with the EAS service.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  release:
    name: EAS Build + Submit (consumer — all platforms)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: EAS Build (consumer — all platforms)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile consumer --platform all --non-interactive

      - name: EAS Submit (consumer — all platforms)
        # Submits the most recently completed build for this profile.
        # Apple/Google credentials are pulled from EAS, not GitHub secrets.
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --profile consumer --platform all --non-interactive --latest
