name: Web Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Typecheck & Next.js Build" and "Smoke Test (Vercel Preview)" are required
  # status checks on main's branch protection. Required checks that never run
  # (e.g. because a path filter on the trigger skipped the whole workflow)
  # show as permanently pending and block every PR that doesn't touch web
  # code. Detecting the path change inside the workflow instead — as a
  # job-level `if:` — keeps both job names always scheduled: they run for
  # real on web/package changes, or report "skipped" (which GitHub counts as
  # a pass) otherwise.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for web/package changes
        id: filter
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
             | grep -qE '^(apps/web/|packages/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck-and-build:
    name: Typecheck & Next.js Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web app
        run: pnpm --filter @openboat/web typecheck

      - name: Build web app
        run: pnpm --filter @openboat/web build
        env:
          DATABASE_URL: "postgres://ci:ci@localhost/ci"
          SESSION_SECRET: "ci-placeholder-secret-minimum-32-chars-long"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          CRON_SECRET: "ci_cron_placeholder"
          RESEND_API_KEY: "re_ci_placeholder"

  smoke-test:
    name: Smoke Test (Vercel Preview)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    # Only run when Vercel will create a preview deployment (PRs to main).
    if: github.event_name == 'pull_request'

    steps:
      - name: Wait for Vercel preview deployment
        id: vercel-url
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 10 * 60 * 1000; // 10 min max

            core.info(`Waiting for Vercel deployment for SHA ${sha}`);

            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, environment: "Preview",
              });

              for (const d of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: d.id, per_page: 1,
                });
                const latest = statuses[0];
                if (!latest) continue;
                if (latest.state === "success") {
                  const url = latest.environment_url || latest.target_url;
                  core.info(`Deployment ready: ${url}`);
                  core.setOutput("url", url);
                  return url;
                }
                if (latest.state === "failure" || latest.state === "error") {
                  core.setFailed(`Vercel deployment failed with state: ${latest.state}`);
                  return;
                }
              }

              core.info("Not ready yet — retrying in 15s");
              await new Promise(r => setTimeout(r, 15000));
            }

            core.setFailed("Timed out waiting for Vercel preview deployment (10 min)");

      - name: Health check
        run: |
          URL="${{ steps.vercel-url.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "No deployment URL — skipping health check"
            exit 1
          fi
          echo "Hitting $URL/api/health"
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            "$URL/api/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — the deploy is broken (env vars missing or startup error)"
            echo "Look up the digest in Vercel Logs to see the exact error"
            exit 1
          fi
          echo "Health check passed"
