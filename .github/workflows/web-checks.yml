name: Web Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web app
        run: pnpm --filter @openboat/web typecheck

      - name: Build web app
        run: pnpm --filter @openboat/web build
