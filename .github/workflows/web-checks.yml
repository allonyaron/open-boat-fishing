name: Web Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Typecheck & Next.js Build", "Tests", and "Smoke Test (Vercel Preview)"
  # are required status checks on main's branch protection. Required checks
  # that never run (e.g. because a path filter on the trigger skipped the whole
  # workflow) show as permanently pending and block every PR that doesn't touch
  # web code. Detecting the path change inside the workflow instead — as a
  # job-level `if:` — keeps every job name always scheduled: they run for real
  # on relevant changes, or report "skipped" (which GitHub counts as a pass)
  # otherwise.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for web/package changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^(apps/web/|packages/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # `turbo test` also runs the mobile lib tests, and the e2e spec and
          # this workflow define the job itself — so the test gate is wider.
          if echo "$CHANGED" | grep -qE '^(apps/|packages/|e2e/|playwright\.config\.ts$|turbo\.json$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/web-checks\.yml$)'; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck-and-build:
    name: Typecheck & Next.js Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web app
        run: pnpm --filter @openboat/web typecheck

      - name: Build web app
        run: pnpm --filter @openboat/web build
        env:
          DATABASE_URL: "postgres://ci:ci@localhost/ci"
          SESSION_SECRET: "ci-placeholder-secret-minimum-32-chars-long"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          CRON_SECRET: "ci_cron_placeholder"
          RESEND_API_KEY: "re_ci_placeholder"

  # Runs every unit/integration suite (`turbo test`: web API routes against a
  # real Postgres, db, utils, mobile lib) and the booking Playwright spec against
  # a production build serving a seeded demo operator.
  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: openboat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two databases: the web vitest global-setup truncates every table, so the
      # e2e seed lives in its own DB that the unit run can't wipe.
      DATABASE_URL_TEST: postgres://ci:ci@localhost:5432/openboat_test
      E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/openboat_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create e2e database
        run: psql "$DATABASE_URL_TEST" -c "CREATE DATABASE openboat_e2e"

      # Explicit, so a migration that can't apply to a fresh database fails the
      # job here rather than surfacing as unrelated test failures.
      - name: Migrate test databases
        run: |
          DATABASE_URL="$DATABASE_URL_TEST" pnpm --filter @openboat/db migrate
          DATABASE_URL="$E2E_DATABASE_URL" pnpm --filter @openboat/db migrate

      - name: Unit and integration tests
        run: pnpm turbo test

      - name: Seed e2e database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: |
          pnpm exec tsx src/seed-demo.ts > /dev/null  # prints a generated admin password
          pnpm exec tsx src/seed-trips-demo.ts
          pnpm exec tsx src/seed-test-trip.ts
          pnpm exec tsx src/seed-test-customers.ts
          OPERATOR_ID=$(psql "$DATABASE_URL" -tAc "SELECT id FROM operators WHERE slug = 'mv-open-boat'")
          test -n "$OPERATOR_ID"
          echo "OPERATOR_ID=$OPERATOR_ID" >> "$GITHUB_ENV"

      - name: Build and start web app
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          SESSION_SECRET: "ci-placeholder-secret-minimum-32-chars-long"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          CRON_SECRET: "ci_cron_placeholder"
          RESEND_API_KEY: "re_ci_placeholder"
        run: |
          pnpm --filter @openboat/web build
          nohup pnpm --filter @openboat/web start -p 3100 > "$RUNNER_TEMP/web-server.log" 2>&1 &
          # /api/health runs `select 1`, so this also proves the app reaches the DB.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health; then exit 0; fi
            sleep 1
          done
          echo "Web app didn't become healthy in 60s"
          cat "$RUNNER_TEMP/web-server.log"
          exit 1

      - name: Install Playwright browsers
        # The "mobile" project emulates an iPhone, which runs on WebKit.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Booking flow (Playwright)
        env:
          E2E_BASE_URL: "http://localhost:3100"
        run: pnpm exec playwright test e2e/booking-flow.spec.ts

      - name: Upload Playwright results and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            screenshots/
            ${{ runner.temp }}/web-server.log
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test (Vercel Preview)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    # Only run when Vercel will create a preview deployment (PRs to main).
    if: github.event_name == 'pull_request'

    steps:
      - name: Wait for Vercel preview deployment
        id: vercel-url
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 10 * 60 * 1000; // 10 min max

            core.info(`Waiting for Vercel deployment for SHA ${sha}`);

            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, environment: "Preview",
              });

              for (const d of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: d.id, per_page: 1,
                });
                const latest = statuses[0];
                if (!latest) continue;
                if (latest.state === "success") {
                  const url = latest.environment_url || latest.target_url;
                  core.info(`Deployment ready: ${url}`);
                  core.setOutput("url", url);
                  return url;
                }
                if (latest.state === "failure" || latest.state === "error") {
                  core.setFailed(`Vercel deployment failed with state: ${latest.state}`);
                  return;
                }
              }

              core.info("Not ready yet — retrying in 15s");
              await new Promise(r => setTimeout(r, 15000));
            }

            core.setFailed("Timed out waiting for Vercel preview deployment (10 min)");

      - name: Health check
        run: |
          URL="${{ steps.vercel-url.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "No deployment URL — skipping health check"
            exit 1
          fi
          echo "Hitting $URL/api/health"
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            "$URL/api/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — the deploy is broken (env vars missing, startup error, or DB unreachable)"
            echo "Look up the digest in Vercel Logs to see the exact error"
            exit 1
          fi
          echo "Health check passed"
